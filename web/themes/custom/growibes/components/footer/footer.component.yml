$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Footer
status: stable
group: Global
description: 'Global footer — brand, Main menu columns, and contact CTA.'
props:
  type: object
  properties:
    brand:
      type: string
      title: Brand
      default: GROWIBES
      examples:
        - GROWIBES
    tagline:
      type: string
      title: Tagline
      default: Enterprise digital engineering for the Drupal + AI era.
      examples:
        - Enterprise digital engineering for the Drupal + AI era.
    logo_href:
      type: string
      title: Logo href
      default: /
      format: uri-reference
    logo_src:
      type: string
      title: Logo image URL
      default: /themes/custom/growibes/logo.jpeg
      format: uri-reference
    cta_href:
      type: string
      title: CTA href
      default: /contact
      format: uri-reference
    cta_label:
      type: string
      title: CTA label
      default: Talk to an Architect
slots:
  navigation:
    title: Navigation
libraryOverrides:
  dependencies:
    - growibes/global
