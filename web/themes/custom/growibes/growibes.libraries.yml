fonts:
  css:
    base:
      'https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap':
        type: external
        minified: true

global-styling:
  version: 1.3.5
  css:
    base:
      css/global.css: {}
    theme:
      components/header/header.css: {}
      components/footer/footer.css: {}
  js:
    js/growibes.js:
      attributes:
        defer: true
  dependencies:
    - growibes/fonts
    - core/drupal
    - core/once

system:
  version: 1.0.1
  css:
    theme:
      css/system.css: {}
  dependencies:
    - growibes/global-styling

contact:
  version: 1.0.3
  css:
    theme:
      css/contact.css: {}
  js:
    js/contact.js: {}
  dependencies:
    - growibes/global-styling
    - core/drupal

global:
  dependencies:
    - growibes/global-styling
